[[item]]
id = "J1:pinout"
verdict = "unknown"
pin = ""
cite = ""
text = "J1 is a generic 2-pin header (pin 1 = VCC, pin 2 = GND) with no MPN / LCSC number and no description of the mating cable or host. I can't check pin 1 against a datasheet or the mating side; add the connector MPN and the mating pinout."

[[item]]
id = "J1:current"
verdict = "unknown"
pin = ""
cite = "KENTO KT-0603-R spec A.1, p.2 Max parameter (IF 25 mA)"
text = "The load is only the LED branch, at most 25 mA (D1's IF max), so any header contact will very likely be enough. J1 has no MPN, though, so I can't check its contact rating against a datasheet."

[[item]]
id = "J1:protection"
verdict = "issue"
pin = "VCC"
cite = "KENTO KT-0603-R spec A.1, p.2 Max parameter (VR 5 V) and p.3 (IR max 1 uA at VR = 5 V)"
text = "J1 is an unkeyed 2-pin header with no reverse-polarity protection. If the supply is plugged in backwards, almost the whole supply voltage lands across D1 in reverse (R1 drops about 0 V at IR <= 1 uA), and D1's VR max is 5 V. Fix: use a keyed connector, add a series diode, or put an anti-parallel diode across D1."

