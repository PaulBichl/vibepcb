text = ""

[[item]]
id = "D1:ratings"
verdict = "unknown"
pin = ""
cite = "KENTO KT-0603-R spec A.1, p.2 Max parameter (IF 25 mA, Pd 55 mW, VR 5 V), p.3 (VF 1.6-2.4 V), p.4 Fig.3 derating"
text = "VCC has no stated voltage (net name has none, no intent.toml). With R1 = 330 Ohm and VF min 1.6 V, IF stays under 25 mA only for VCC <= 9.8 V (5 V gives about 10.3 mA, which is fine). Fig.3 derates IF to about 5 mA at 85 C, so state VCC and the ambient temperature."

[[item]]
id = "D1:orientation"
verdict = "ok"
pin = "pin1"
cite = "KENTO KT-0603-R spec A.1, p.1 polarity symbol and green cathode mark"
text = "D1 pin1 (anode) is on LED_A from R1 and pin2 (cathode) is on GND, so the LED is forward-biased from VCC. Check that the footprint's cathode pad matches the green mark side when assembled."

