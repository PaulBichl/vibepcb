[[finding]]
id = "review:J1:protection"
ref = "J1"
pin = "VCC"
text = "J1 is an unkeyed 2-pin header with no reverse-polarity protection. If the supply is plugged in backwards, almost the whole supply voltage lands across D1 in reverse (R1 drops about 0 V at IR <= 1 uA), and D1's VR max is 5 V. Fix: use a keyed connector, add a series diode, or put an anti-parallel diode across D1. [KENTO KT-0603-R spec A.1, p.2 Max parameter (VR 5 V) and p.3 (IR max 1 uA at VR = 5 V)]"
status = "open"
reason = ""
source = "review"

