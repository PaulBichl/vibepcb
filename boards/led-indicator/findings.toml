[[finding]]
id = "review:D1:ratings"
ref = "D1"
pin = ""
text = "VCC has no stated voltage (net name has none, no intent.toml). With R1 = 330 Ohm and VF min 1.6 V, IF stays under 25 mA only for VCC <= 9.8 V (5 V gives about 10.3 mA, which is fine). Fig.3 derates IF to about 5 mA at 85 C, so state VCC and the ambient temperature. [KENTO KT-0603-R spec A.1, p.2 Max parameter (IF 25 mA, Pd 55 mW, VR 5 V), p.3 (VF 1.6-2.4 V), p.4 Fig.3 derating] (reviewer could not decide)"
status = "open"
reason = ""
