# IPC class 2 (dedicated service electronics) design margins, on top of a fab profile.
# Basis: IPC-6012 class 2 tolerates 90 deg annular-ring breakout; IPC-2221B adds a fabrication
# allowance for drill wander. The ring values are conservative design figures (~0.05 mm left for
# drill registration), not quoted from the standard's tables.
# An application layer only tightens: each min_* takes the larger of the value so far and its own.
kind = "application"
description = "IPC class 2 design margins"

min_clearance = 0.10              # IPC-2221B table 6-1, B2 (external, uncoated), 0-30 V
min_via_annular_ring = 0.10
min_pth_annular_ring = 0.15
