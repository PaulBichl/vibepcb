# Part spec for TPS62133RGTR (format: vibepcb/parts/spec.py). Pages are PDF pages of the datasheet
# SLVSAG7F (tps62130.pdf, revised November 2021): pin table page 3, package outline RGT0016C page 40.

[part]
mpn = "TPS62133RGTR"
manufacturer = "Texas Instruments"
description = "3-17 V 3 A step-down converter, 5.0 V fixed output, VQFN-16 3 x 3 mm"
datasheet = "https://www.ti.com/lit/ds/symlink/tps62130.pdf"
source = "manual"
lifecycle = "unknown"
kind = "ic"

[package]
# RGT0016C VQFN, 1 mm max height: body 2.9-3.1 square, 0.8-1.0 high, terminals 16X 0.3-0.5 long,
# 16X 0.18-0.30 wide, pitch 0.5, exposed thermal pad 1.68 +-0.07 (unnumbered in the datasheet: pin 17 here)
family = "QFN"
pins = 16
pitch = 0.5
span = [2.9, 3.1]
body = { l = [2.9, 3.1], w = [2.9, 3.1], h = [0.8, 1.0] }
lead = { l = [0.3, 0.5], w = [0.18, 0.3] }
exposed_pad = { l = [1.61, 1.68, 1.75], w = [1.61, 1.68, 1.75], number = "17" }
page = 40

[[pin]]
number = "1"
name = "SW"
type = "power_out"
page = 3
